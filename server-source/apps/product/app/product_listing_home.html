<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>上品工具</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f6f8fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1180px;margin:0 auto;padding:38px 28px}.head{margin-bottom:26px}.head h1{margin:0 0 7px;font-size:30px}.head p{margin:0;color:#697386}.entries{display:grid;gap:18px}.entry{display:block;padding:26px 30px;border:2px solid;border-radius:14px;text-decoration:none;transition:transform .15s,box-shadow .15s}.entry:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(28,44,75,.1)}.entry h2{margin:0 0 10px;font-size:25px}.entry p{margin:0;font-size:16px;font-weight:600}.manual{background:#effcf3;border-color:#82e69a;color:#175c39}.auto{background:#eef5ff;border-color:#93bfff;color:#285dcc}.foot{margin-top:22px;color:#7a8497;font-size:13px}
  </style>
</head>
<body>
  <main class="shell">
    <header class="head"><h1>上品工具</h1><p>请选择本次上品方式</p></header>
    <section class="entries">
      <a class="entry manual" href="batch-manual"><h2>自主上新品</h2><p>自主上新品 · 单品资料确认 / Amazon 模板填写 / 自检</p></a>
      <a class="entry auto" href="batch-auto"><h2>批量自动化上新品</h2><p>批量自动化上新品 · Excel 选品导入 / 八步自动化流程</p></a>
    </section>
    <p class="foot">两个入口共用原有上品填表与校验底层，业务数据和执行进度彼此独立。</p>
  </main>
</body>
</html>
