<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>批量自动化上新品</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#d9dee8;--page:#f3f6fa;--panel:#fff;--blue:#2f6fed;--green:#16835d}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font:12px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;overflow-x:hidden}.shell{width:100%;padding:12px}.top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.crumb{color:var(--blue);text-decoration:none}.title h1{margin:4px 0 2px;font-size:22px}.title p{margin:0;color:var(--muted)}.actions{display:flex;gap:6px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:6px 9px;border-radius:7px;cursor:pointer;text-decoration:none;white-space:normal;text-align:center}.btn.primary,.btn.analyze{background:var(--blue);border-color:var(--blue);color:#fff}.btn.small{padding:4px 6px;font-size:11px}.btn:disabled{cursor:not-allowed;opacity:.65}.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 6px 18px rgba(24,37,64,.05)}.summary{display:flex;gap:16px;padding:9px 10px;border-bottom:1px solid var(--line);color:var(--muted);flex-wrap:wrap}.summary strong{color:var(--ink);margin-left:3px}.tabs{display:flex;gap:5px;padding:8px 9px;border-bottom:1px solid var(--line)}.tab{border:1px solid var(--line);border-radius:7px;background:#fff;padding:5px 13px;cursor:pointer}.tab.active{background:var(--blue);border-color:var(--blue);color:#fff}.table-wrap{overflow-y:auto;overflow-x:hidden;max-height:calc(100vh - 180px)}table{border-collapse:separate;border-spacing:0;width:100%;min-width:0;table-layout:fixed}th,td{width:12.5%;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}th{position:sticky;top:0;z-index:3;background:#eaf0f9;color:#3e4b62;text-align:left;font-size:11px}th span{display:block;color:var(--blue);font-size:10px;margin-bottom:2px}td{background:#fff}tr:hover td{background:#fbfdff}.step1,.step2,.step3,.step4,.step5,.step6,.step7,.step8{width:12.5%}.asin{font-weight:700;overflow-wrap:anywhere}.owner{display:inline-flex;background:#eef3ff;color:#315fbb;border-radius:999px;padding:1px 5px;font-size:10px;margin-left:3px}.muted{color:var(--muted);font-size:10px}.status{display:inline-flex;padding:1px 5px;border-radius:999px;background:#fff4dd;color:#9a6300;font-size:10px}.status.ok{background:#eaf8f1;color:var(--green)}input,select,textarea{width:100%;min-width:0;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);padding:5px;margin-top:4px;font:inherit}textarea{min-height:48px;resize:vertical}.row-actions{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}.row-actions>*{flex:1 1 54px}.file{color:var(--green);font-size:10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}.progress{height:5px;border-radius:999px;background:#e7ebf2;overflow:hidden;margin:5px 0}.progress b{display:block;height:100%;background:var(--blue)}.prompt-count{font-size:10px;color:var(--muted)}.toast{position:fixed;right:16px;bottom:16px;background:#172033;color:#fff;padding:8px 11px;border-radius:7px;display:none;z-index:20}.empty{padding:36px;text-align:center;color:var(--muted)}@media(max-width:900px){body{font-size:10px}.shell{padding:6px}th,td{padding:4px}.title p{display:none}}
    .variant-editor{margin-top:7px;padding:6px;border:1px solid #cbd7ef;border-radius:7px;background:#f7f9fe}.variant-head,.variant-line{display:grid;gap:4px}.variant-head b{font-size:10px;color:#315fbb}.variant-line input{margin-top:3px;background:#fff}
    .workflow{margin-top:7px;padding:8px;border-radius:9px;background:linear-gradient(145deg,#111b35,#243c78);color:#fff;box-shadow:0 6px 14px rgba(35,74,160,.2)}.flow-top{display:flex;justify-content:space-between;align-items:center}.flow-top strong{font-size:15px;color:#7ee7ff}.flow-track{height:9px;margin:6px 0;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden}.flow-track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#38bdf8,#6366f1,#a855f7);box-shadow:0 0 10px #67e8f9;transition:width .5s}.flow-stages{display:flex;justify-content:space-between;gap:2px;font-size:8px;color:#8494bd}.flow-stages .done{color:#5eead4}.flow-stages .now{color:#fff;font-weight:700}.flow-message{margin-top:5px;font-size:10px;color:#e8edff}.flow-eta{font-size:10px;color:#fcd34d}.template-panel{margin-top:7px;padding:7px;border:1px solid #d4dceb;border-radius:8px;background:#f8faff}.template-panel .file{margin-left:5px}.completed-download{display:block;margin-top:7px;padding:7px;border-radius:7px;text-align:center;text-decoration:none;font-weight:700;color:#fff;background:linear-gradient(90deg,#16a36f,#2f6fed)}.price-label{display:block;margin:3px 0 8px;font-weight:700;color:#42526b}.price-label input{font-weight:400;color:var(--ink)}
  </style>
<script src="/inventory/msku-prefix.js?v=20260913"></script></head>
<body>
<main class="shell">
  <header class="top"><div class="title"><a class="crumb" href="batch-fast">← 返回上品工具</a><h1 id="pageTitle">批量自动化上新品</h1><p id="pageSubtitle">按 8 个步骤推进；Amazon 最终文件仍由原填表器、校验器和红框扫描把关。</p></div><div class="actions"><button class="btn primary" id="addProduct" style="display:none">新增竞品链接</button><button class="btn primary" id="claimAll">一键分析全部</button><button class="btn" id="refresh">刷新</button><button class="btn primary" id="export">导出当前负责人领星表</button></div></header>
  <section class="panel"><div class="summary" id="summary"></div><div class="tabs" id="tabs"></div><div class="table-wrap" id="table"></div></section>
</main><div class="toast" id="toast"></div>
<script>
  const manual=location.pathname.endsWith('/batch-manual'); const productPrefix=location.pathname.startsWith('/product/')?'/product':''; const apiBase=productPrefix+(manual?'/api/batch-manual':'/api/batch-auto'); const fileBase=productPrefix+(manual?'/batch-manual/file':'/batch-auto/file');
  const state={data:null,batch:null,owner:''}; const $=s=>document.querySelector(s); const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(manual){document.title='自主上新品';$('#pageTitle').textContent='自主上新品';$('#pageSubtitle').textContent='在空白行粘贴竞品链接，保存后会自动补出下一行。'}
  async function api(url,options){const res=await fetch(url,options);const data=await res.json();if(!res.ok||data.ok===false)throw new Error(data.error||'请求失败');return data}
  function toast(text){const el=$('#toast');el.textContent=text;el.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>el.style.display='none',2500)}
  async function load(){state.data=await api(apiBase);state.batch=state.data.batches[0]||null;if(state.batch&&!state.owner)state.owner=state.batch.owners?.[0]||'';render()}
  const tableHead='<thead><tr><th class="step1"><span>第 1 列</span>竞品、分析进度与 Amazon 模板</th><th class="step2"><span>第 2 列</span>定价</th><th class="step3"><span>第 3 列</span>变体主题</th><th class="step4"><span>第 4 列</span>1688 采购</th><th class="step5"><span>第 5 列</span>MSKU</th><th class="step6"><span>第 6 列</span>产品名</th><th class="step7"><span>第 7 列</span>本地六图</th><th class="step8"><span>第 8 列</span>领星上传表</th></tr></thead>';
  const blankRow=()=>({id:'draft',asin:'',owner:'自主',competitor_url:'',analysis:{status:'待分析',experience_hits:[]},template_file:{exists:false,name:''},template_info:{status:'待从 Haul 入口下载',product_type:'',variation_themes:[]},variation_theme:'',procurement_url:'',procurement_name:'',procurement_quantity:'10',purchase_cost:'',supplier_name:'',msku:'',product_name:'',optimized_title:'',bullet_1:'',sync_status:'等待生成 Amazon 模板',image_job:{status:'未开始',progress:0,prompts:[]},lingxing:{exists:false,name:''}});
  function workflowPanel(r){const a=r.analysis||{},p=Math.max(0,Math.min(100,Number(a.progress)||(a.status==='分析完成'?100:a.status==='分析中'?18:0)));const stages=['经验池','竞品','模板','写表','自检','上传','回执'];const active=Math.min(stages.length-1,Math.floor(p/15));return `<div class="workflow"><div class="flow-top"><b>${esc(a.status||'待分析')}</b><strong>${p}%</strong></div><div class="flow-track"><i style="width:${p}%"></i></div><div class="flow-stages">${stages.map((s,i)=>`<span class="${i<active?'done':i===active?'now':''}">${s}</span>`).join('')}</div><div class="flow-message">${esc(a.phase_label||'等待开始')}</div><div class="flow-eta">预计：${esc(a.eta_label||'开始后约 10–20 分钟')}</div></div>`}
  function templatePanel(r){const ti=r.template_info||{};return `<div class="template-panel"><div><span class="status ${r.amazon_file?.exists||r.template_file.exists?'ok':''}">${esc(r.amazon_file?.exists?'填表完成':ti.status||'等待 Haul 模板')}</span><span class="file">${esc(r.amazon_file?.name||r.template_file.name||'暂无模板')}</span></div><div class="muted">Product Type：${esc(ti.product_type||'待识别')}</div><div class="row-actions"><button class="btn small upload-template">${r.template_file.exists?'替换模板':'上传模板'}</button><button class="btn small disabled">Haul 模板下载</button></div>${r.amazon_file?.exists?`<a class="completed-download" download href="${fileBase}?path=${encodeURIComponent(r.amazon_file.path)}">下载填好的表格</a>`:''}</div>`}
  function render(){const t=state.data?.totals||{};$('#summary').innerHTML=`产品 <strong>${t.rows||0}</strong>　已识别模板 <strong>${t.templates||0}</strong>　分析完成 <strong>${t.analyzed||0}</strong>　六图完成 <strong>${t.images||0}</strong>　更新时间 <strong>${esc(state.data?.updated_at||'—')}</strong>`;if(!state.batch){$('#tabs').innerHTML='';$('#table').innerHTML=manual?`<table>${tableHead}<tbody>${rowHtml(blankRow(),true)}</tbody></table>`:`<table>${tableHead}<tbody><tr><td colspan="8"><div class="empty">还没有导入选品表。</div></td></tr></tbody></table>`;return}const owners=state.batch.owners||[];$('#tabs').innerHTML=owners.map(o=>`<button class="tab ${o===state.owner?'active':''}" data-owner="${esc(o)}">${esc(o)}</button>`).join('');const rows=state.batch.rows.filter(r=>!state.owner||r.owner===state.owner);if(manual)rows.push(blankRow());$('#table').innerHTML=`<table>${tableHead}<tbody>${rows.map(r=>rowHtml(r,r.id==='draft')).join('')}</tbody></table>`}
  function rowHtml(r,draft=false){const a=r.analysis||{},ti=r.template_info||{},im=r.image_job||{},locked=draft?'disabled':'';return `<tr data-batch="${esc(state.batch?.id||'manual-listing')}" data-row="${esc(r.id)}" ${draft?'data-draft="true"':''}>
    <td><div><span class="asin">${esc(draft?'新产品':r.asin||r.id)}</span><span class="owner">${esc(r.owner)}</span></div><input data-field="competitor_url" value="${esc(r.competitor_url)}" placeholder="粘贴 Amazon 竞品链接"><div class="row-actions"><a class="btn small" href="${esc(r.competitor_url||'#')}" target="_blank" ${draft?'style="pointer-events:none;opacity:.5"':''}>打开竞品</a><button class="btn small analyze claim-analysis" ${draft||a.status==='分析中'||a.status==='分析完成'?'disabled':''}>${esc(a.status==='分析中'?'分析中':a.status==='分析完成'?'分析完成':'分析')}</button></div>${workflowPanel(r)}${templatePanel(r)}</td>
    <td><label class="price-label">List Price<input data-field="list_price" value="${esc(r.list_price)}" placeholder="可编辑"></label><label class="price-label">Haul Price<input data-field="haul_price" value="${esc(r.haul_price)}" placeholder="可编辑"></label><div class="muted">你填写的价格优先；留空时根据竞品与规则估算，写表前仍会校验。</div></td>
    <td>${variationSelect(r)}<div class="muted">只显示当前模板 Valid Values 的精确值</div>${variantEditor(r)}</td>
    <td><input data-field="procurement_url" value="${esc(r.procurement_url)}" placeholder="1688 采购链接"><input data-field="procurement_name" value="${esc(r.procurement_name)}" placeholder="1688 产品名"><div style="display:flex;gap:6px"><input data-field="procurement_quantity" value="${esc(r.procurement_quantity)}" placeholder="数量"><input data-field="purchase_cost" value="${esc(r.purchase_cost)}" placeholder="采购成本"></div><input data-field="supplier_name" value="${esc(r.supplier_name)}" placeholder="供应商名称"><div class="muted">1688 自动搜索在授权后启用</div></td>
    <td><input data-field="msku" value="${esc(r.msku)}" placeholder="系统生成，可编辑"><div class="muted">${esc(r.sync_status||'')}</div></td>
    <td><input data-field="product_name" value="${esc(r.product_name)}" placeholder="产品名，可编辑"><textarea data-field="bullet_1" placeholder="五点描述 1">${esc(r.bullet_1)}</textarea><div class="muted">其余五点由分析任务写入</div></td>
    <td><span class="status ${im.status==='生成完成'?'ok':''}">${esc(im.status||'未开始')}</span><div class="progress"><b style="width:${Number(im.progress)||0}%"></b></div><div class="muted">文件夹：${esc(im.folder_name||'填写 MSKU + 产品名后生成')}</div><div class="prompt-count">已准备 ${im.prompts?.length||0}/6 条英文绘图提示词</div><div class="row-actions"><button class="btn small prepare-images">准备六图任务</button><button class="btn small disabled" title="由已登录 ChatGPT 的上品电脑领取">电脑领取生成</button></div></td>
    <td><div class="muted">采购员自动使用负责人：${esc(r.owner)}</div><div class="file">${esc(r.lingxing.name||'等待导出')}</div><div class="row-actions">${r.lingxing.exists?`<a class="btn small" download href="${fileBase}?path=${encodeURIComponent(r.lingxing.path)}">下载</a>`:''}</div><div class="muted">字段：SKU、品名、型号、数量、采购员、成本、供应商、含税单价</div></td></tr>`}
  const defaultVariationThemes=['COLOR','COLOR/SET_NAME','COLOR/SIZE','NUMBER_OF_ITEMS','SET_NAME','SIZE','SIZE/SET_NAME','STYLE_NAME'];
  function variationSelect(r){const exact=(r.template_info?.variation_themes||[]).filter(v=>!String(v).includes('(Deprecated:'));const values=exact.length?exact:defaultVariationThemes;return `<select data-field="variation_theme"><option value="">自动判断（根据竞品）</option>${values.map(v=>`<option ${v===r.variation_theme?'selected':''}>${esc(v)}</option>`).join('')}</select>`}
  const variantLabels={COLOR:'颜色',NUMBER_OF_ITEMS:'数量',SIZE:'尺寸',SET_NAME:'款式/套装名',STYLE_NAME:'款式',PATTERN_NAME:'图案',ITEM_PACKAGE_QUANTITY:'包装数量',ORIENTATION:'方向'};
  function themeDims(theme){return String(theme||'').split(' (Deprecated:',1)[0].split('/').map(v=>v.trim()).filter(Boolean)}
  function variantEditor(r){const dims=themeDims(r.variation_theme);if(!dims.length)return '<div class="muted" style="margin-top:6px">未手填时将依据竞品自动选择变体并继续</div>';const saved=Array.isArray(r.variant_rows)?r.variant_rows:[];const complete=x=>dims.every(d=>String(x?.[d]||'').trim());const rows=saved.length&&!complete(saved[saved.length-1])?saved:[...saved,{}];const count=saved.filter(complete).length;const grid=`grid-template-columns:repeat(${dims.length},minmax(0,1fr))`;return `<div class="variant-editor"><div class="variant-head" style="${grid}">${dims.map(d=>`<b>${esc(variantLabels[d]||d)}</b>`).join('')}</div>${rows.map((item,i)=>`<div class="variant-line" style="${grid}">${dims.map(d=>`<input class="variant-value" data-dimension="${esc(d)}" data-index="${i}" value="${esc(item[d]||'')}" placeholder="${esc(variantLabels[d]||d)}">`).join('')}</div>`).join('')}<div class="muted">已确认 ${count} 个变体；填满一行自动增加下一行</div></div>`}
  async function save(row,field,value){await api(`${apiBase}/save`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:row.dataset.batch,row_id:row.dataset.row,fields:{[field]:value}})})}
  document.addEventListener('change',async e=>{const row=e.target.closest('tr');if(!row)return;try{if(e.target.classList.contains('variant-value')){const values=[];row.querySelectorAll('.variant-line').forEach(line=>{const item={};line.querySelectorAll('.variant-value').forEach(input=>item[input.dataset.dimension]=input.value);values.push(item)});await save(row,'variant_rows',values);toast('变体已保存，自动继续填表');await load();return}const field=e.target.dataset.field;if(!field)return;if(row.dataset.draft==='true'){if(field!=='competitor_url'||!e.target.value.trim())return;await api(`${apiBase}/add`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({competitor_url:e.target.value,owner:'自主'})});state.owner='自主';await load();document.querySelector('tr[data-draft="true"] input[data-field="competitor_url"]')?.focus();toast('已保存，下一行已准备');return}await save(row,field,e.target.value);toast(field==='variation_theme'?'主题已选择，请填写变体明细':'已保存并同步到任务');await load()}catch(err){toast(err.message);await load()}});
  document.addEventListener('click',async e=>{const owner=e.target.closest('[data-owner]');if(owner){state.owner=owner.dataset.owner;render();return}if(e.target.id==='refresh'){await load();toast('已刷新');return}if(e.target.id==='addProduct'){const url=prompt('请粘贴 Amazon 竞品链接');if(!url)return;try{await api(`${apiBase}/add`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({competitor_url:url,owner:'自主'})});state.owner='自主';await load();toast('已新增产品')}catch(err){toast(err.message)}return}if(e.target.id==='claimAll'){if(!state.batch){toast('暂无可分析产品');return}try{const d=await api(`${apiBase}/claim-all`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:state.batch.id})});await load();toast(d.count?`已提交 ${d.count} 个分析任务`:'所有产品已在分析')}catch(err){toast(err.message)}return}if(e.target.id==='export'){if(!state.batch){toast('请先新增产品');return}try{const d=await api(`${apiBase}/export-lingxing`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:state.batch.id,owner:state.owner})});await load();location.href=`${fileBase}?path=${encodeURIComponent(d.path)}`;toast(`已导出 ${d.count} 行`)}catch(err){toast(err.message)}return}const row=e.target.closest('tr');if(!row)return;if(e.target.closest('.claim-analysis')){try{await api(`${apiBase}/claim`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:row.dataset.batch,row_id:row.dataset.row})});await load();toast('已提交分析任务')}catch(err){toast(err.message)}return}if(e.target.closest('.upload-template')){const input=document.createElement('input');input.type='file';input.accept='.xlsx,.xlsm';input.onchange=async()=>{if(!input.files[0])return;const f=new FormData();f.append('batch_id',row.dataset.batch);f.append('row_id',row.dataset.row);f.append('file',input.files[0]);try{await api(`${apiBase}/upload-template`,{method:'POST',body:f});await load();toast('模板已识别')}catch(err){toast(err.message)}};input.click();return}if(e.target.closest('.prepare-images')){try{await api(`${apiBase}/prepare-images`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({batch_id:row.dataset.batch,row_id:row.dataset.row})});await load();toast('六图任务和提示词已准备')}catch(err){toast(err.message)}}});
  load().catch(e=>toast(e.message));
</script>
</body></html>
